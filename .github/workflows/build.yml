name: Build Debug APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Flatten Project
        run: |
          echo "Listing repository contents:"
          ls -la
          
          # Create temporary extraction directory
          mkdir -p temp_extracted
          unzip -q ChessVisionOverlay-android.zip -d temp_extracted
          
          # Find the directory containing settings.gradle.kts automatically
          PROJECT_PATH=$(find temp_extracted -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: Could not locate settings.gradle.kts inside the zip file."
            exit 1
          fi
          
          echo "Found project at: $PROJECT_PATH"
          
          # Move project contents to the root repository workspace
          shopt -s dotglob
          mv "$PROJECT_PATH"/* .
          rm -rf temp_extracted ChessVisionOverlay-android.zip
          
          echo "Workspace structure ready for build:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
