name: Build and Release APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          echo "Extracting project..."
          unzip -q ChessVisionOverlay-android.zip -d extracted_project
          # Finds the inner folder name automatically and moves contents to root
          cd extracted_project/*
          shopt -s dotglob
          mv * ../../
          cd ../../
          rm -rf extracted_project ChessVisionOverlay-android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ChessVisionOverlay/gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ChessVisionOverlay

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: ChessVisionOverlay v1.0.${{ github.run_number }}
          files: ChessVisionOverlay/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
